<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urbanix - Login</title>

   <link rel="stylesheet" href="css/login.css">
</head>

<body>

<form onsubmit="handleLogin(event)">

    <img src="urbanix_versao_pequena.png" alt="Logo">

    <input type="email" id="user" placeholder="Email" required>
    <input type="password" id="password" placeholder="Senha" required>

    <button type="submit">Acessar</button>

    <a href="esqueceu_senha.html">Esqueceu a senha?</a>

    <div class="popup" id="popup">
        <span id="myPopup"></span>
    </div>

</form>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>

<script>
async function handleLogin(event) {
    event.preventDefault();

    const email = document.getElementById('user').value;
    const senha = document.getElementById('password').value;

    const popup = document.getElementById('popup');
    const texto = document.getElementById('myPopup');

    const { data, error } = await login(email, senha);

    if (error) {
        texto.innerText = "Email ou senha inválidos!";
        popup.style.backgroundColor = "red";
    } else {
        texto.innerText = "Login realizado com sucesso!";
        popup.style.backgroundColor = "green";

        setTimeout(() => {
            window.location.href = "spectra.html";
        }, 1000);
    }

    popup.classList.add("show");
}
</script>

</body>
</html>
